<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>/*DATA*/</script>
<script>
(()=>{
const D=window.KTS, $=s=>document.querySelector(s);
const cObj=D.countries.objects[Object.keys(D.countries.objects)[0]];
const aObj=D.admin1.objects[Object.keys(D.admin1.objects)[0]];
const land=topojson.merge(D.countries,cObj.geometries);
/* Lighter copy of the map, drawn while the globe moves. The detailed one is drawn when it comes to rest. */
const loObj=D.countriesLo.objects[Object.keys(D.countriesLo.objects)[0]];
const landLo=topojson.merge(D.countriesLo,loObj.geometries);
const bordersLo=topojson.mesh(D.countriesLo,loObj,(a,b)=>a!==b&&a.properties.id!==b.properties.id);
const GRAT10=d3.geoGraticule10(),GRAT5=d3.geoGraticule().step([5,5])(),SPHERE={type:'Sphere'};
const coast=topojson.mesh(D.countries,cObj,(a,b)=>a===b);
const borders=topojson.mesh(D.countries,cObj,(a,b)=>a!==b&&a.properties.id!==b.properties.id);
const IDS=Object.keys(D.meta);
const geomsById={};for(const g of cObj.geometries)(geomsById[g.properties.id]??=[]).push(g);
const shapeCache={};
function shape(id){return shapeCache[id]??=topojson.merge(D.countries,geomsById[id]);}
const shapeLoCache={};
function shapeLo(id){return shapeLoCache[id]??=(()=>{const lo=D.countriesLo.objects[Object.keys(D.countriesLo.objects)[0]].geometries.filter(g=>g.properties.id===id);return lo.length?topojson.merge(D.countriesLo,lo):shape(id);})();}
function admins(a0){return aObj.geometries.filter(g=>g.properties.adm0_a3===a0).map(g=>topojson.feature(D.admin1,g));}

/* ---------- store helpers ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let recent=[];try{recent=JSON.parse(sessionStorage.getItem('kts-recent')||'[]')}catch(e){}
function remember(id){recent.push(id);recent=recent.slice(-20);try{sessionStorage.setItem('kts-recent',JSON.stringify(recent))}catch(e){}}

/* ---------- selection (FR1–FR4) ---------- */
function pickCountry(){const pool=IDS.filter(i=>!recent.includes(i));return pool[Math.floor(Math.random()*pool.length)];}
function polygonsOf(f){const g=f.geometry||f;return g.type==='Polygon'?[g.coordinates]:g.coordinates;}
function pickPoint(id){
  const polys=polygonsOf(shape(id)).map(c=>({type:'Polygon',coordinates:c}));
  const w=polys.map(p=>d3.geoArea(p));const tot=d3.sum(w);let r=Math.random()*tot,poly=polys[0];
  for(let i=0;i<polys.length;i++){r-=w[i];if(r<=0){poly=polys[i];break}}
  const [[x0,y0],[x1,y1]]=d3.geoBounds(poly);const span=x1>=x0?x1-x0:x1+360-x0;
  for(let t=0;t<4000;t++){let x=x0+Math.random()*span;if(x>180)x-=360;const y=y0+Math.random()*(y1-y0);
    if(d3.geoContains(poly,[x,y]))return {pt:[x,y],poly};}
  return {pt:d3.geoCentroid(poly),poly};
}
function findAdmin(id,pt){const list=admins(D.meta[id].a0);if(list.length<2)return null;
  return list.find(f=>d3.geoContains(f,pt))||null;}

/* ---------- canvas + view ---------- */
const cv=$('#globe'),ctx=cv.getContext('2d'),wheelEl=$('#wheel');
const proj=d3.geoOrthographic().clipAngle(90).precision(.6),path=d3.geoPath(proj,ctx);
let W=0,H=0,DPR=1,dial={cx:0,cy:0,R:200,r0:128};
const view={lon:-20,lat:18,k:128,cx:0,cy:0};
let innerExtra=0, sel=null, phase='idle', colors={}, texture=null, hatch=null;
function readColors(){const s=getComputedStyle(document.documentElement);for(const k of ['ink','sea','sea-edge','land','grat','red','brass','brass-lo','bg'])colors[k]=s.getPropertyValue('--'+k).trim();

  const dens=m.pop&&m.area?m.pop/m.area:null,gpp=m.gdp&&m.pop?m.gdp/m.pop:null;
  const popAs=m.popYear?`${m.popYear}`:'',gdpAs=m.gdpYear?`${m.gdpYear}`:'';
  const forestRow=v.forest!=null&&!(v.forest===0&&m.area<1000)?`<div class="wide"><dt>Forest cover</dt><dd><span class="bar" aria-hidden="true"><i style="width:${Math.max(1,v.forest)}%"></i></span>${v.forest}% of land</dd></div>`:'';
  const coast=m.landlocked?'Landlocked':(v.coast?km(v.coast)+' km':null);
  const st=v.standout;
  $('#cardScroll').innerHTML=`
   <div class="pp-head"><span>Visa page</span><span>No. ${String(IDS.indexOf(sel.id)+1).padStart(3,'0')} / ${sel.id}</span></div>
   <div class="pp-title">
     <div class="flag" role="img" aria-label="Flag of ${esc(m.name)}">${m.flag||''}</div>
     <h2 id="cName" tabindex="-1">${esc(m.name)}</h2>
     ${m.official&&m.official!==m.name?`<div class="official">${esc(m.official)}</div>`:'<div></div>'}
     ${stampSVG(m,ds)}
   </div>
   ${sub?`<p class="subtitle">Landed in <b>${esc(sub)}</b></p>`:''}
   <div class="coords" aria-label="Coordinates">${fmtC(pt)}</div>
   <div id="tstripWrap">${timeStrip(m,pt)}</div>
   ${v.about?`<p class="about" id="about">${esc(v.about)}</p><button class="more" aria-controls="about" onclick="document.getElementById('about').classList.add('full');this.remove()">Read more</button>`:''}
   ${st?`<figure class="standout"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[st.cat]||ICONS.Natural}</svg><figcaption><span>${esc(st.cat)} · claim to fame</span>${esc(st.text)}${st.src?`<a class="srclink" href="${esc(st.src)}" target="_blank" rel="noopener">Source</a>`:''}</figcaption></figure>`:''}
   <dl class="facts quick">
     ${factRow('Capital',m.cap)}
     ${factRow('Continent · region',[m.region,m.sub].filter(Boolean).join(' · '))}
     ${factRow('Population',m.pop&&bigNum(m.pop),popAs)}
     ${factRow('Area',m.area&&km(m.area)+' km²')}
     ${factRow('Languages',m.lang)}
     ${factRow('Currency',m.cur)}
   </dl>
   <div class="secs">
   ${section('Nature and geography',[forestRow,factRow('Coastline',coast),factRow('Highest point',v.high&&`${v.high[0]}, ${km(v.high[1])} m`),factRow('Longest river',v.river&&`${v.river[0]}, ${km(v.river[1])} km`),factRow('Climate',v.climate)],v.coast?'Approximate figures, rounded. Coastline length depends on how it is measured.':'')}
   ${section('People and society',[factRow('Population density',dens&&(dens<10?dens.toFixed(1):km(dens))+' per km²'),factRow('Median age',v.age&&v.age+' years'),factRow('Life expectancy',v.life&&v.life+' years'),factRow('Literacy rate',v.lit!=null&&v.lit+'% of adults'),factRow('Urban population',v.urban!=null&&v.urban+'% in cities')])}
   ${section('Government and economy',[factRow('Government',m.gov,null,true),factRow('Head of state',m.hos,m.leadersAsOf),factRow('Head of government',m.hog,m.leadersAsOf),factRow('GDP',m.gdp&&bigNum(m.gdp,true),gdpAs),factRow('GDP per person',gpp&&'$'+(Math.round(gpp/10)*10).toLocaleString('en-US'),gdpAs),factRow('National day',v.day,null,true)])}
   ${section('National symbols',[factRow('Animal',v.animal),factRow('Bird',v.bird),factRow('Flower',v.flower),factRow('Tree',v.tree),factRow('Sport',v.sport)],(v.animal||v.bird||v.flower||v.tree||v.sport)?'“Traditional” and “popular” mark symbols that are not official.':'')}
   ${section('Practical bits',[factRow('Driving side',m.drive),factRow('Calling code',m.idd),factRow('Internet domain',m.tld),factRow('UNESCO World Heritage sites',v.unesco!=null?(v.unesco?String(v.unesco):'None yet'):null,v.unesco!=null?'2025':null)])}
   </div>
   ${m.facts?`<div class="dyk"><h3>Did you know?</h3><ol>${m.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ol></div>`:''}
   <p class="src">Population, GDP and society figures: World Bank. Leaders: ${esc(m.leadersAsOf)}. ${m.full?'Text reviewed.':'Text is a draft awaiting review.'} Borders: Natural Earth, India view. Time zones: IANA database.</p>`;
  clearInterval(clockTimer);clockTimer=setInterval(()=>{const w=document.getElementById('tstripWrap');if(w&&phase==='card')w.innerHTML=timeStrip(m,pt);},1000);
  card.hidden=false;dock.classList.add('hidden');
  requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.add('open')));
  setTimeout(()=>{thud();},isReduced()?0:120);
  $('#cardScroll').scrollTop=0;$('#cName').focus({preventScroll:true});
  $('#live').textContent=`Landed in ${sub?sub+', ':''}${m.name}, at ${fmtC(pt)}.`;
}
async function closeCard(quick){
  if(phase!=='card')return;phase='closing';clearInterval(clockTimer);card.classList.remove('open');dock.classList.remove('hidden');
  spinBtn.textContent='Spin';hint.textContent='195 countries, equal odds.';
  wheelEl.classList.remove('away');
  const from={...view};const to={lon:from.lon,lat:Math.max(-35,Math.min(35,from.lat)),k:dial.r0,cx:dial.cx,cy:dial.cy};const ik=d3.interpolate(Math.log(from.k),Math.log(to.k));
  if(sel){sel.zoomed=false;}
  if(isReduced())Object.assign(view,to);else await tween(quick?650:1000,e=>{view.lat=from.lat+(to.lat-from.lat)*e;view.k=Math.exp(ik(e));view.cx=from.cx+(to.cx-from.cx)*e;view.cy=from.cy+(to.cy-from.cy)*e;});
  card.hidden=true;if(sel){sel.shown=false;sel.drop=0;}
  phase='idle';if(!quick)spinBtn.focus();
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  for(const t of tweens.slice()){const p=Math.min(1,(now-t.t0)/t.dur);t.fn(t.ease(p));if(p>=1){tweens.splice(tweens.indexOf(t),1);t.res();}}
  if(phase==='idle'){view.lon+=dt*(isReduced()?0:4);view.lat+=(15-view.lat)*Math.min(1,dt*.6);if(view.lon>180)view.lon-=360;coordText.textContent=fmtC([norm(view.lon),view.lat]);}
  const t0=performance.now();syncWheel();const drew=draw();if(drew)perfLog(phase,now,performance.now()-t0);requestAnimationFrame(frame);}
/* Frame timing for profiling: window.__ktsPerf.summary() in the console. Keeps the last 600 frames. */
const perf=window.__ktsPerf={frames:[],summary(ph){const f=this.frames.filter(x=>!ph||x.ph===ph);if(f.length<2)return null;
  const gaps=f.slice(1).map((x,i)=>x.t-f[i].t).filter(g=>g<500),draws=f.map(x=>x.d).sort((a,b)=>a-b);
  return {frames:f.length,fps:Math.round(1000/(gaps.reduce((a,b)=>a+b,0)/gaps.length)),drawMs:+(draws.reduce((a,b)=>a+b,0)/draws.length).toFixed(1),drawP95:+draws[Math.floor(draws.length*.95)].toFixed(1)};}};
function perfLog(ph,t,d){perf.frames.push({ph,t,d});if(perf.frames.length>600)perf.frames.shift();}

/* ---------- wiring ---------- */
spinBtn.onclick=()=>spin();
$('#againBtn').onclick=()=>spin();
$('#closeBtn').onclick=()=>closeCard(false);
cv.addEventListener('pointerdown',()=>{if(phase==='spin'||phase==='land'||phase==='zoom')skip();});
addEventListener('keydown',e=>{if(e.key==='Escape'&&phase==='card')closeCard(false);});
const onTheme=()=>{readColors();lastSig='';};
mq.addEventListener?.('change',syncToggles);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',onTheme);
new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
addEventListener('resize',layout);
texture=makeTexture();readColors();buildWheel();layout();syncToggles();
view.k=dial.r0;view.cx=dial.cx;view.cy=dial.cy;
requestAnimationFrame(frame);
window.__ktsSpin=id=>spin(id);
})();
</script>
